events {}

http {
    log_format fail2ban '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent';

    access_log /var/log/nginx/access.log fail2ban;
    error_log /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 5173;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            limit_req zone=frontend_limit burst=10 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }
}
